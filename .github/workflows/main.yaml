name: Docker Build

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build=arg PYTHON_VERSION -t docker-practice:latest .

      - name: Run Docker container
        run: docker run --rm docker-practice:latest
